baseURL = "https://harikt.com/"
title = "Hari KT"
theme = "blowfish"
languageCode = "en-GB"
defaultContentLanguage = "en"
paginate = 10
enableRobotsTXT = true

[params]
  colorScheme = "blowfish"
  defaultAppearance = "light"
  autoSwitchAppearance = true
  
  [params.header]
    logoText = "Home"
  
  [params.author]
    name = "Hari KT"
    image = "harik-small.jpg"
    headline = "Freelancer working with international clients"
    bio = "Freelancer | Founder of [Tripti](https://tripti.cloud/) and [Tanvish](https://tanvish.com/) | Maintainer of [AuraPHP](https://auraphp.com/)"
    links = [
      { linkedin = "https://www.linkedin.com/in/harikt" },
      { twitter = "https://x.com/harikt" },
      { github = "https://github.com/harikt" },
      { stackoverflow = "https://stackoverflow.com/users/487878/hari-k-t" }
    ]

  [params.homepage]
    layout = "profile"
    showRecent = true
    showRecentItems = 5

  [params.article]
    showDate = true
    showViews = false
    showReadingTime = true
    showAuthor = true
    
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    tabWidth = 4
  [markup.goldmark.renderer]
    unsafe = true

[menu]
  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 10
  [[menu.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 30
